<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- assign page_title = page.title | default: site.title -%}
  <title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page_title }} · {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta property="og:type" content="website">
  {%- if page.cover %}<meta property="og:image" content="{{ page.cover | absolute_url }}">{% endif %}
  <link rel="icon" type="image/png" sizes="72x72" href="{{ '/assets/img/favicon-72.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="144x144" href="{{ '/assets/img/favicon-144.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="288x288" href="{{ '/assets/img/favicon-288.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <script>
    (function () {
      var l;
      try { l = localStorage.getItem('lang'); } catch (e) {}
      if (l !== 'en' && l !== 'ja') l = 'en';   // English by default; JA only if the visitor chose it
      document.documentElement.setAttribute('lang', l);
    })();
  </script>
  {%- if page.url == "/" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Satomi Tokida",
    "alternateName": "時田 聡実",
    "url": "{{ site.url }}/",
    "image": "{{ '/assets/img/prof_pic.jpg' | absolute_url }}",
    "jobTitle": "Ph.D. student",
    "affiliation": { "@type": "CollegeOrUniversity", "name": "The University of Tokyo" },
    "description": "{{ site.description | strip_newlines | strip }}",
    "sameAs": [
      "https://scholar.google.com/citations?user={{ site.social.scholar }}",
      "https://x.com/{{ site.social.twitter }}",
      "https://www.linkedin.com/in/{{ site.social.linkedin }}",
      "https://github.com/{{ site.social.github }}"
    ]
  }
  </script>
  {%- endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
</head>
<body class="page-{% if page.url == "/" %}home{% else %}{{ page.url | slugify }}{% endif %}">
  {% include header.html %}
  <main id="main" class="site-main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>

# ---------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: pretty

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      cols: 6            # width on the home grid, out of 12 columns
      rows: 3            # height on the home grid, in rows (~76px each)

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - _old_alfolio
  - .github
